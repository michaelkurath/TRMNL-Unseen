---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.3
serverless_language: node
refresh_interval_floor: ''
polling_url: "{{ assets_base_url }}/data/ping.json"
polling_headers: ''
polling_body: ''
id: 510793
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_info
  field_type: author_bio
  name: About Unseen
  category: images,education
  github_url: https://github.com/michaelkurath/TRMNL-Unseen
  description: See a butterfly wing, human hair, or a sheet of paper under an electron microscope. Unseen brings 60 real micrographs to your TRMNL, one specimen at a time. Look closely at the structures behind familiar things, from the ridges of a wing to the fibres in a sheet of paper.<br/><br/>Install and choose Daily or Every refresh. Daily is the default. You can show or hide the subject caption. The original scale bar, when present, stays with the image, and the photo credit and licence are always shown.<br/><br/>Photographs by MUSE and University of Tartu contributors. <a href="https://github.com/michaelkurath/TRMNL-Unseen#readme">Setup and source credits</a> · <a href="https://github.com/michaelkurath/TRMNL-Unseen/issues">Support and feedback</a>.
- keyname: picture_mode
  field_type: select
  name: Picture change mode
  description: Daily shows one specimen per local calendar day. Every refresh advances on each plugin data refresh.
  options:
  - Daily: daily
  - Every refresh: every_refresh
  default: daily
- keyname: show_caption
  field_type: boolean
  name: Show subject caption
  description: Image credit remains visible in both modes.
  default: true
- keyname: assets_base_url
  field_type: string
  name: Public collection URL (advanced)
  description: Leave the default to use the included collection. Change this only for a separately hosted copy.
  default: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
  placeholder: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
name: Unseen
description: One real micrograph every day
refresh_interval: 60
