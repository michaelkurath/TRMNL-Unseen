---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.3
serverless_language: node
refresh_interval_floor: ''
polling_url: "{{ assets_base_url }}/data/ping.json"
polling_headers: ''
polling_body: ''
id: 510793
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
custom_fields:
- keyname: author_info
  field_type: author_bio
  name: About Unseen
  github_url: https://github.com/michaelkurath/TRMNL-Unseen
  description: Discover 60 real scanning electron micrographs of familiar materials, natural structures and tiny engineered worlds. Choose one picture per local calendar day or a new picture on every plugin refresh.<br/><br/> No API key or separate hosting is needed. Leave Public collection URL at its default, choose a picture mode, then save. Replaying a cached playlist screen does not advance the collection. Photo credits remain visible with captions off.<br/><br/> Photography from MUSE and University of Tartu contributors; individual CC BY and CC BY-SA credits appear on every plate. <a href="https://github.com/michaelkurath/TRMNL-Unseen#readme">Setup and source credits</a> · <a href="https://github.com/michaelkurath/TRMNL-Unseen/issues">Support and feedback</a>.
- keyname: assets_base_url
  field_type: string
  name: Public collection URL
  description: Public image source. The default uses this plugin's GitHub repository; no separate hosting account is required.
  default: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
  placeholder: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
- keyname: picture_mode
  field_type: select
  name: Picture change mode
  description: Daily keeps the same picture for the local calendar day. Every refresh advances to the next picture on each scheduled plugin refresh or Force Refresh.
  options:
  - Daily: daily
  - Every refresh: every_refresh
  default: daily
- keyname: show_caption
  field_type: select
  name: Show subject caption
  description: Image credit remains visible in both modes.
  options:
  - 'Yes': 'yes'
  - 'No': 'no'
  default: 'yes'
name: Unseen
description: Discover the microscopic world
refresh_interval: 60
