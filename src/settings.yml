---
name: UNSEEN
description: A hidden world, every day
strategy: polling
polling_url: '{{ assets_base_url }}/data/ping.json'
polling_verb: get
refresh_interval: 60
no_screen_padding: 'yes'
framework_version: latest
custom_fields:
  - keyname: author_info
    field_type: author_bio
    name: About UNSEEN
    github_url: https://github.com/michaelkurath/TRMNL-Unseen
    description: Real museum micrographs, one per local calendar day. Prototype collection of ten subjects. Photographs by Nicola Angeli / MUSE, CC BY-SA 3.0; prepared images retain that licence.
  - keyname: assets_base_url
    field_type: string
    name: Public collection URL
    description: Public image source. The default uses this plugin's GitHub repository; no separate hosting account is required.
    default: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
    placeholder: https://raw.githubusercontent.com/michaelkurath/TRMNL-Unseen/main
  - keyname: show_caption
    field_type: select
    name: Show subject caption
    description: Image credit remains visible in both modes.
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
